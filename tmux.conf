# reamp prefix from 'ctrl+b' to 'ctrl+a'
unbind C-b
set -g prefix C-a

set -g update-environment 'DISPLAY SSH_AUTH_SOCK SSH_CONNECTION GH_ENTERPRISE_TOKEN LINEAR_TOKEN'

set-environment -g SSH_AUTH_SOCK "$HOME/.ssh/ssh_auth_sock"

# vim-like pane switching
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

setw -g mouse on

# window split commands
unbind %
bind-key '\' split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# window switching
bind -n S-down new-window
bind -n S-left prev
bind -n S-right next

# workmux
bind C-s display-popup -h 30 -w 100 -E "workmux dashboard"
bind Tab run-shell "workmux last-agent"

# dev-website: run it in this pane's worktree, or pick a worktree.
bind w run-shell "~/.local/bin/dev-here '#{pane_current_path}'"
bind M-w display-popup -E "git -C /workspaces/mmwebsite worktree list | fzf | cut -d' ' -f1 | xargs -r ~/.local/bin/dev-here"
# Window list (the default on w).
bind W choose-tree -Zw

# Reload tmux config
bind r source-file ~/.tmux.conf \; display-message -d 3000 '🍭 Config reloaded!'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'jimeh/tmux-themepack'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key' # prefix + space
set -g @plugin 'tmux-plugins/tmux-yank' # copying highlighted text
# Keep continuum after tmux-themepack. Continuum saves through a hook in
# status-right, and tmux-themepack replaces status-right.
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-themepack sets its options only when they are unset, so a reload would
# keep the values from an earlier load. Clear them first.
run-shell 'for o in $(tmux show -g | grep -oE "^@(theme|themepack|powerline)-[^ ]+"); do tmux set -gu "$o"; done'
# tmux-themepack reads these when it loads, so set them before TPM runs.
set -g @themepack 'powerline/default/cyan'
# ANSI color names, so the WezTerm color scheme sets the real colors. The bar
# uses the Oceanic Next base01 gray, which has no ANSI name.
set -g @powerline-color-main-1 green
set -g @powerline-color-grey-1 "#343D46"
set -g @powerline-status-fg cyan
set -g @powerline-color-activity-1 yellow
set -g @theme-window-status-current-bg red
set -g @theme-window-status-current-fg brightwhite
# The copy mode selection, for example a mouse drag.
set -g @theme-mode-bg brightblack
set -g @theme-mode-fg default
# The workmux status icon, inside the tab before its closing arrow.
set -g @themepack-window-status-format "#I:#W#F#{?@workmux_status, #{@workmux_status},}"
set -g @themepack-window-status-current-format "#[bold]#I:#W#F#{?@workmux_status, #{@workmux_status},}"
# The theme's left and right sides with only the session, time and date parts.
# The session part turns yellow while the prefix is active.
set -g @theme-status-left "#[fg=black,bg=#{?client_prefix,yellow,#{@powerline-status-left-area-left-bg}},bold] #S#{?client_prefix, PREFIX,} #[fg=#{?client_prefix,yellow,#{@powerline-status-left-area-left-bg}},bg=#{@theme-status-bg},nobold]"
set -g @theme-status-right "💪 #[fg=yellow,bg=#{@theme-status-bg}]#[fg=black,bg=yellow] %-I:%M%p %Z #[fg=green,bg=yellow]#[fg=black,bg=green] %Y-%m-%d "

# set -g @continuum-restore 'on'
set -g @continuum-save-interval '240' # time is measured in minutes
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

set -g default-terminal "tmux-256color"
# sync relays DECSET 2026 so full-screen TUIs repaint atomically instead of
# tearing; screen-256color cannot advertise it.
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:sync"
# devpod ssh leaves newline conversion on in the local terminal, so a bare \n
# arrives as \r\n and side-by-side panes draw text in the wrong column
# (loft-sh/devpod#932). Move the cursor down with CUD instead.
set -as terminal-overrides ',*:cud1=\E[B'

TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_MENU="switch session\n/$HOME/.tmux/plugins/tmux-fzf/scripts/session.sh switch\n"

# Enable using the mouse to resize panes
# https://superuser.com/a/1017275/120685
#
# Toggle the mouse off to copy text without having to shift-click.
# https://stackoverflow.com/a/65153140/406224
# Key binding: ctrl-a a
bind-key a set-option -g mouse \; display-message '🐭 Mouse #{?mouse,on,off}'

# https://github.com/tmux-plugins/tpm/blob/master/docs/automatic_tpm_installation.md#automatic-tpm-installation
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the bottom of tmux.conf,
# below only the settings that must override plugins)
run '~/.tmux/plugins/tpm/tpm'
