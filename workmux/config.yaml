# workmux global config — symlinked to ~/.config/workmux/config.yaml by install.sh.
# Machine-wide defaults; per-repo overrides go in each repo's .workmux.yaml.
# Full reference: `workmux config reference`

# Nerd Font glyphs in the dashboard/sidebar.
nerdfont: true

# Dashboard color scheme (cycle live with shift+T).
theme: slate-garden

# Agent for the <agent> pane placeholder: default model + xhigh effort.
agent: "claude --effort xhigh"

# Worktrees as windows in the current session (vs. session-per-worktree).
mode: window

# Default `workmux merge` strategy (override per-merge with --merge/--squash).
merge_strategy: rebase

# Default sibling layout <project>__worktrees. A centralized worktree_dir
# (e.g. "~/.workmux/{project}") makes the dashboard mislabel the project.

# Name worktrees/windows by branch basename (part after the last '/').
worktree_naming: basename

# Populate gitignored files into each new worktree (missing sources skipped).
files:
  copy:
    - .env
    - .env.local
  symlink:
    - node_modules

# Larger live-agent preview in the dashboard (% of pane, 10-90).
dashboard:
  preview_size: 80

# Lifecycle hooks — set these per-repo in .workmux.yaml, not globally:
# post_create:   # runs in a new worktree before its window opens (blocks)
#   - mise install
# pre_merge:     # runs before `workmux merge`; non-zero exit aborts
#   - npm test
